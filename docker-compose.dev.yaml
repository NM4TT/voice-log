services:
  voice-log-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: voice-log-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      default:
        aliases:
          - frontend
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CI=true
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: pnpm dev --host 0.0.0.0 --port 5173

  # ── CLOUDFLARE QUICK TUNNELS (FOR MOBILE TESTING) ───────────────────────
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: voice-log-tunnel-dev
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - .env
    depends_on:
      - voice-log-dev
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
